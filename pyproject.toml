[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "memecheck"
version = "0.7.1"
description = "Crypto risk toolkit: pre-trade screening, position sizing, real-time monitoring across both DEX (Solana / EVM) and CEX (Kraken Futures / Hyperliquid) perpetuals. Zero runtime dependencies."
requires-python = ">=3.9"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "PARVAUX" }]
maintainers = [{ name = "PARVAUX" }]
keywords = [
  "defi", "solana", "evm", "rugcheck", "honeypot", "dexscreener",
  "perpetuals", "perp", "funding-rate", "kraken-futures", "hyperliquid",
  "risk-management", "position-sizing", "memecoin",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial",
  "Topic :: Office/Business :: Financial :: Investment",
]
# Runtime dependencies: NONE — stdlib only. This is intentional.
dependencies = []

[project.urls]
Homepage = "https://github.com/Guannings/on-chain-risk-screener"
Repository = "https://github.com/Guannings/on-chain-risk-screener"
Issues = "https://github.com/Guannings/on-chain-risk-screener/issues"
Changelog = "https://github.com/Guannings/on-chain-risk-screener/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
memecheck = "memecheck.cli:main"

[tool.setuptools]
packages = [
  "memecheck",
  "memecheck.common",
  "memecheck.scanner",
  "memecheck.monitor",
  "memecheck.monitor.action",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["memecheck"]
