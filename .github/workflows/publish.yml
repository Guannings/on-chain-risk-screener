name: publish

# Builds the sdist + wheel and uploads to PyPI on every git tag push.
# Uses PyPI Trusted Publishing (OIDC) — no API token, nothing to rotate.
#
# One-time setup (already done if PyPI shows a Trusted Publisher for memecheck):
#   1. Go to https://pypi.org/manage/account/publishing/
#   2. Add a new pending publisher:
#        PyPI Project Name: memecheck
#        Owner:             Guannings
#        Repository name:   on-chain-risk-screener
#        Workflow name:     publish.yml
#        Environment name:  pypi
#   3. Save.
#
# To ship a new release after setup:
#   bump version in pyproject.toml and CHANGELOG.md
#   git commit -am "release: vX.Y.Z"
#   git tag vX.Y.Z
#   git push && git push --tags
# The workflow runs automatically.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build sdist + wheel
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # required for Trusted Publishing
    permissions:
      id-token: write          # OIDC token for PyPI
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
