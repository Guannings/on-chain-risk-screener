<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .box-in     { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .box-core   { fill: #ffffff; stroke: #1f2937; stroke-width: 1.8; }
    .box-out    { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.6; }
    .title      { fill: #111827; font-size: 14px; font-weight: 700; }
    .item       { fill: #1f2937; font-size: 12.5px; font-weight: 600; }
    .sub        { fill: #4b5563; font-size: 11px; font-weight: 400; }
    .colhead    { fill: #6b7280; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; }
    .arrow      { stroke: #4b5563; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .arrow-out  { stroke: #15803d; stroke-width: 1.6; fill: none; marker-end: url(#ag); }
  </style>
  <defs>
    <marker id="a"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <!-- Column headers -->
  <text class="colhead" x="150" y="30" text-anchor="middle">INPUTS</text>
  <text class="colhead" x="490" y="30" text-anchor="middle">SHARED ENGINES</text>
  <text class="colhead" x="850" y="30" text-anchor="middle">OUTPUTS</text>

  <!-- ===== INPUTS ===== -->

  <!-- DEX inputs -->
  <rect class="box-in" x="30" y="55"  width="240" height="120" rx="10"/>
  <text class="title" x="150" y="80"  text-anchor="middle">DEX path</text>
  <text class="sub"   x="150" y="100" text-anchor="middle">on-chain token address</text>
  <text class="item"  x="150" y="125" text-anchor="middle">scan · watch · prep</text>
  <text class="sub"   x="150" y="148" text-anchor="middle">DexScreener · RugCheck</text>
  <text class="sub"   x="150" y="164" text-anchor="middle">honeypot.is</text>

  <!-- CEX inputs -->
  <rect class="box-in" x="30" y="200" width="240" height="120" rx="10"/>
  <text class="title" x="150" y="225" text-anchor="middle">CEX perp path</text>
  <text class="sub"   x="150" y="245" text-anchor="middle">ticker symbol</text>
  <text class="item"  x="150" y="270" text-anchor="middle">cex-check · cex-prep · cex-watch</text>
  <text class="sub"   x="150" y="293" text-anchor="middle">Kraken Futures</text>
  <text class="sub"   x="150" y="309" text-anchor="middle">Hyperliquid (fallback)</text>

  <!-- Backtest input -->
  <rect class="box-in" x="30" y="345" width="240" height="100" rx="10"/>
  <text class="title" x="150" y="370" text-anchor="middle">Backtest tape</text>
  <text class="sub"   x="150" y="390" text-anchor="middle">(ts, liquidity_usd, price_usd) CSV</text>
  <text class="item"  x="150" y="415" text-anchor="middle">backtest</text>
  <text class="sub"   x="150" y="435" text-anchor="middle">replays past observations</text>

  <!-- Pure math inputs (calc, plan) -->
  <rect class="box-in" x="30" y="470" width="240" height="56" rx="10"/>
  <text class="title" x="150" y="494" text-anchor="middle">Pure math</text>
  <text class="item"  x="150" y="514" text-anchor="middle">plan · calc</text>

  <!-- ===== SHARED ENGINES ===== -->

  <rect class="box-core" x="370" y="55"  width="240" height="100" rx="10"/>
  <text class="title" x="490" y="82"  text-anchor="middle">Threshold analyzers</text>
  <text class="sub"   x="490" y="103" text-anchor="middle">aggregate metrics, raise flags,</text>
  <text class="sub"   x="490" y="118" text-anchor="middle">compute verdicts</text>
  <text class="sub"   x="490" y="138" text-anchor="middle">named constants · zero deps</text>

  <rect class="box-core" x="370" y="180" width="240" height="120" rx="10"/>
  <text class="title" x="490" y="207" text-anchor="middle">Decider</text>
  <text class="sub"   x="490" y="227" text-anchor="middle">rolling state + rules + debounce</text>
  <text class="sub"   x="490" y="245" text-anchor="middle">critical floor · large event · slow bleed</text>
  <text class="sub"   x="490" y="263" text-anchor="middle">side-aware funding analysis</text>
  <text class="sub"   x="490" y="285" text-anchor="middle">→ NONE · ALERT · EXECUTE</text>

  <rect class="box-core" x="370" y="325" width="240" height="120" rx="10"/>
  <text class="title" x="490" y="352" text-anchor="middle">Position planner</text>
  <text class="sub"   x="490" y="372" text-anchor="middle">R-multiple sizing</text>
  <text class="sub"   x="490" y="390" text-anchor="middle">liquidation-distance safety</text>
  <text class="sub"   x="490" y="408" text-anchor="middle">fees + side-aware funding cost</text>
  <text class="sub"   x="490" y="426" text-anchor="middle">TP scenarios at 1R / 2R / 3R</text>

  <!-- ===== OUTPUTS ===== -->

  <rect class="box-out" x="710" y="55"  width="240" height="60" rx="10"/>
  <text class="title" x="830" y="80"  text-anchor="middle">stdout</text>
  <text class="sub"   x="830" y="100" text-anchor="middle">human text · structured JSON</text>

  <rect class="box-out" x="710" y="130" width="240" height="60" rx="10"/>
  <text class="title" x="830" y="155" text-anchor="middle">Audit log</text>
  <text class="sub"   x="830" y="175" text-anchor="middle">JSONL · one line per tick</text>

  <rect class="box-out" x="710" y="205" width="240" height="60" rx="10"/>
  <text class="title" x="830" y="230" text-anchor="middle">Trade journal</text>
  <text class="sub"   x="830" y="250" text-anchor="middle">SQLite · prep / cex-prep history</text>

  <rect class="box-out" x="710" y="280" width="240" height="100" rx="10"/>
  <text class="title" x="830" y="305" text-anchor="middle">Alert dispatcher</text>
  <text class="sub"   x="830" y="325" text-anchor="middle">console (always)</text>
  <text class="sub"   x="830" y="342" text-anchor="middle">Telegram · Discord · ntfy</text>
  <text class="sub"   x="830" y="360" text-anchor="middle">(env-gated)</text>

  <rect class="box-out" x="710" y="395" width="240" height="60" rx="10"/>
  <text class="title" x="830" y="420" text-anchor="middle">Exit codes</text>
  <text class="sub"   x="830" y="440" text-anchor="middle">0 / 1 / 2 / 3 — composable in shells</text>

  <!-- Arrows: inputs → engines -->
  <line class="arrow" x1="270" y1="115" x2="368" y2="100"/>
  <line class="arrow" x1="270" y1="260" x2="368" y2="240"/>
  <line class="arrow" x1="270" y1="395" x2="368" y2="240"/>
  <line class="arrow" x1="270" y1="498" x2="368" y2="385"/>

  <!-- Arrows: engines → outputs -->
  <line class="arrow-out" x1="610" y1="85"  x2="708" y2="85"/>
  <line class="arrow-out" x1="610" y1="240" x2="708" y2="160"/>
  <line class="arrow-out" x1="610" y1="240" x2="708" y2="235"/>
  <line class="arrow-out" x1="610" y1="280" x2="708" y2="330"/>
  <line class="arrow-out" x1="610" y1="385" x2="708" y2="235"/>
  <line class="arrow-out" x1="610" y1="385" x2="708" y2="425"/>
</svg>
